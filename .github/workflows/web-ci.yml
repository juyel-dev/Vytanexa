name: web-ci

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/i18n-check.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/web/**"
      - "packages/**"
      - "scripts/i18n-check.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web typecheck and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck and verify translation keys
        run: npm run typecheck --workspace=apps/web

      - name: Install pinned ESLint tooling for this legacy Next.js workspace
        run: npm install --no-save --package-lock=false --workspaces=false eslint@8.57.1 eslint-config-next@14.2.15

      - name: Lint web application
        run: npm run lint --workspace=apps/web
